
name: Coplace IPA Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Coplace Unsigned IPA
    runs-on: macos-15-intel

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project Coplace.xcodeproj

      - name: Build iOS App
        run: |
          set -e

          xcodebuild \
            -project Coplace.xcodeproj \
            -scheme Coplace \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e

          APP="build/Build/Products/Release-iphoneos/Coplace.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Coplace.app not found!"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/Coplace.app

          zip -qry Coplace.ipa Payload

          if [ ! -f Coplace.ipa ]; then
            echo "ERROR: IPA packaging failed!"
            exit 1
          fi

          ls -lh Coplace.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Coplace-IPA
          path: Coplace.ipa
          if-no-files-found: error
          retention-days: 14
