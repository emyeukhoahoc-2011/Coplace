name: Coplace iOS IPA

on:
  push:
    branches: [main]
    paths:
      - 'Coplace/**'
      - 'Coplace.xcodeproj/**'
      - '.github/workflows/build-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build signed iOS IPA
    runs-on: macos-15
    env:
      PROJECT: Coplace.xcodeproj
      SCHEME: Coplace
      BUNDLE_ID: com.doni.coplace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check required secrets
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ -n "$P12_BASE64" ]] || { echo 'Missing IOS_CERTIFICATE_BASE64'; exit 1; }
          [[ -n "$P12_PASSWORD" ]] || { echo 'Missing IOS_CERTIFICATE_PASSWORD'; exit 1; }
          [[ -n "$PROFILE_BASE64" ]] || { echo 'Missing IOS_PROVISIONING_PROFILE_BASE64'; exit 1; }
          [[ ${#TEAM_ID} -eq 10 ]] || { echo 'IOS_TEAM_ID must be your 10-character Apple Team ID'; exit 1; }
          xcodebuild -version
          xcodebuild -list -project "$PROJECT"

      - name: Install signing certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/coplace-signing"
          KEYCHAIN_PATH="$SIGN_DIR/coplace.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          mkdir -p "$SIGN_DIR" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$P12_BASE64" | base64 --decode > "$SIGN_DIR/certificate.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$SIGN_DIR/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$SIGN_DIR/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$SIGN_DIR/profile.mobileprovision" > "$SIGN_DIR/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$SIGN_DIR/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$SIGN_DIR/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$SIGN_DIR/profile.plist")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$SIGN_DIR/profile.plist")

          case "$PROFILE_APP_ID" in *."$BUNDLE_ID") ;; *) echo "Provisioning profile app ID mismatch: $PROFILE_APP_ID"; exit 1 ;; esac
          [[ "$PROFILE_TEAM" == "${{ secrets.IOS_TEAM_ID }}" ]] || { echo 'Provisioning profile Team ID does not match IOS_TEAM_ID'; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$SIGN_DIR/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Build for iOS Simulator (unsigned validation)
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      - name: Archive for iPhone/iPad
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Coplace.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES archive

      - name: Export Ad Hoc IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
          </dict></plist>
          PLIST
          plutil -lint "$EXPORT_OPTIONS"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Coplace.xcarchive" \
            -exportPath "$RUNNER_TEMP/Coplace-export" -exportOptionsPlist "$EXPORT_OPTIONS"
          mkdir -p build
          IPA=("$RUNNER_TEMP/Coplace-export"/*.ipa)
          [[ -f "${IPA[0]}" ]] || { echo 'No IPA was exported'; exit 1; }
          cp "${IPA[0]}" build/Coplace.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coplace-IPA
          path: build/Coplace.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Clean up temporary keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
